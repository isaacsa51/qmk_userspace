name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Both Halves
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install QMK
        run: |
          python3 -m pip install --upgrade pip
          pip install qmk
          qmk setup -y
          qmk doctor

      - name: Compile Kyria Display Half
        run: |
          qmk compile -kb splitkb/halcyon/kyria/rev4/isaacsa51 -e HLC_TFT_DISPLAY=1 -e TARGET=kyria_display

      - name: Compile Kyria Trackpad Half
        run: |
          qmk compile -kb splitkb/halcyon/kyria/rev4/isaacsa51 -e HLC_CIRQUE_TRACKPAD=1 -e TARGET=kyria_trackpad

      - name: Rename firmware files
        run: |
          mkdir -p firmware_out
          ls -la .build
          cp .build/splitkb_halcyon_kyria_rev4_isaacsa51_kyria_display*.uf2 firmware_out/kyria_display.uf2 || echo "Kyria Display firmware not found."
          cp .build/splitkb_halcyon_kyria_rev4_isaacsa51_kyria_trackpad*.uf2 firmware_out/kyria_trackpad.uf2 || echo "Kyria Trackpad firmware not found."

      - name: Debug: List firmware_out directory
        run: ls -la firmware_out

      - name: Upload Kyria Display Firmware
        uses: actions/upload-artifact@v3
        with:
          name: kyria_display_firmware
          path: firmware_out/kyria_display.uf2

      - name: Upload Kyria Trackpad Firmware
        uses: actions/upload-artifact@v3
        with:
          name: kyria_trackpad_firmware
          path: firmware_out/kyria_trackpad.uf2

  publish:
    name: 'QMK Userspace Publish'
    if: always() && !cancelled()
    needs: build
    uses: qmk/.github/.github/workflows/qmk_userspace_publish.yml@main
